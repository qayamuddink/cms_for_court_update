          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
