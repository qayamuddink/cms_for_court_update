  /v1/cms/search/reindex:
    post:
      summary: Full search index rebuild
      description: Triggers a comprehensive rebuild of all indexed articles, judgments, and cases.
      operationId: reindexAll
      tags:
        - CMS Search
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reindex status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/search/analytics:
    get:
