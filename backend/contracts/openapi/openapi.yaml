openapi: 3.0.3
info:
  title: LiveLaw Platform API
  description: High-performance Legal Journalism and Live Court Reporting Platform API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Health check
      description: Returns service liveness and database connectivity status.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is healthy and database is connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded or database connection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/auth/register:
    post:
      summary: Register reader account
      description: Creates a new reader account and returns an authenticated token pair.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      summary: Authenticate user
      description: Validates email and password, returning short-lived access token and revocable refresh token.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh tokens
      description: Rotates an active refresh token and returns a new access and refresh token pair.
      operationId: refreshToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed and rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: Logout
      description: Revokes the specified refresh token.
      operationId: logout
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/me:
    get:
      summary: Get current user profile
      description: Retrieves the profile of the currently authenticated user.
      operationId: getMe
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/users:
    post:
      summary: Create staff account (Admin only)
      description: Administrator creates a reporter, editor, or admin account with strong password enforcement.
      operationId: createStaff
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List users (Admin only)
      description: Returns a paginated list of users using keyset pagination.
      operationId: listUsers
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of users to return (max 100)
          schema:
            type: integer
            default: 20
        - name: before_created_at
          in: query
          description: Keyset pagination timestamp cursor
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: Keyset pagination ID cursor
          schema:
            type: string
      responses:
        '200':
          description: Users list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/users/{id}:
    patch:
      summary: Update user role or status (Admin only)
      description: Administrator modifies system role or suspends/unsuspends a user account.
      operationId: updateUser
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid role or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/live:
    get:
      summary: List live court cases
      description: Returns all court cases currently in active live reporting mode.
      operationId: listLiveCases
      tags:
        - Live Cases
      responses:
        '200':
          description: List of active live court cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCasesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}:
    get:
      summary: Get court case details
      description: Retrieves complete metadata and hearing status for a specific court case.
      operationId: getCase
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      responses:
        '200':
          description: Court case details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/updates:
    get:
      summary: Get case updates after sequence
      description: Replays or synchronizes live updates for a court case with sequence number strictly greater than after_sequence.
      operationId: getCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: after_sequence
          in: query
          description: Replay updates with sequence_no greater than this value
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Maximum number of updates to return (max 100)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Ordered list of updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdatesResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/updates/latest:
    get:
      summary: Get latest case updates
      description: Returns the most recent N updates for a court case in ascending chronological order.
      operationId: getLatestCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of updates to return (max 100)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Ordered list of most recent updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdatesResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/stream:
    get:
      summary: Stream live courtroom ticker updates (SSE)
      description: Server-Sent Events stream for real-time court ticker updates. Each event contains the sequence number as event ID for gap detection.
      operationId: streamCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: after_sequence
          in: query
          description: Stream updates with sequence number strictly greater than this value
          schema:
            type: integer
            default: 0
        - name: Last-Event-ID
          in: header
          description: Standard SSE last received event ID (sequence number)
          schema:
            type: string
      responses:
        '200':
          description: Real-time event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases:
    post:
      summary: Create court case (Editor/Admin only)
      description: Registers a new court case for legal coverage and live reporting.
      operationId: createCase
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Court case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}:
    patch:
      summary: Update court case (Editor/Admin only)
      description: Modifies metadata, hearing date, or stage status of a court case.
      operationId: updateCase
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      responses:
        '200':
          description: Court case updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/live:
    post:
      summary: Toggle live coverage state (Editor/Admin only)
      description: Enables or disables the live ticker for a court case.
      operationId: setCaseLive
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLiveRequest'
      responses:
        '200':
          description: Live status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/assign:
    post:
      summary: Assign reporter to case (Editor/Admin only)
      description: Authorizes a reporter to submit live updates from the courtroom.
      operationId: assignReporter
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReporterRequest'
      responses:
        '200':
          description: Reporter assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: assigned
        '400':
          description: Invalid user ID or user is not a reporter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/assign/{userId}:
    delete:
      summary: Unassign reporter from case (Editor/Admin only)
      description: Revokes reporter assignment to a court case.
      operationId: unassignReporter
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: Reporter user UUID
          schema:
            type: string
      responses:
        '200':
          description: Reporter unassigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unassigned
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/reporters:
    get:
      summary: List assigned reporters (Editor/Admin only)
      description: Returns all reporter user IDs authorized to post live updates to this case.
      operationId: listAssignedReporters
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      responses:
        '200':
          description: List of assigned reporter user IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates:
    post:
      summary: Publish live update (Assigned Reporter, Editor, Admin)
      description: Appends a new live update to the court case ticker. Guarantees append-only storage and strictly consecutive sequence numbers.
      operationId: publishLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent duplicate updates
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishUpdatePayload'
      responses:
        '201':
          description: Live update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Case closed or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Reporter must be assigned to case)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Verdict update already posted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates/{updateId}/correct:
    post:
      summary: Correct live update (Assigned Reporter, Editor, Admin)
      description: Appends a new correction update referencing an earlier update. Updates are never edited in place.
      operationId: correctLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: updateId
          in: path
          required: true
          description: Target live update UUID to correct
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectUpdatePayload'
      responses:
        '201':
          description: Correction update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Case closed, update retracted, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates/{updateId}/retract:
    post:
      summary: Retract live update (Assigned Reporter, Editor, Admin)
      description: Appends a retraction update referencing the retracted update. Updates are never deleted or modified in place.
      operationId: retractLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: updateId
          in: path
          required: true
          description: Target live update UUID to retract
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetractUpdatePayload'
      responses:
        '201':
          description: Retraction update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Update already retracted or case closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/articles:
    get:
      summary: Get published articles feed
      description: Returns published news, commentaries, editorials, and judgment summaries using keyset pagination.
      operationId: listArticlesFeed
      tags:
        - Articles
      parameters:
        - name: type
          in: query
          description: Filter by article type
          schema:
            type: string
            enum: [news, commentary, editorial, judgment_summary]
        - name: category
          in: query
          description: Filter by legal category
          schema:
            type: string
        - name: tag
          in: query
          description: Filter by keyword tag
          schema:
            type: string
        - name: court_case_id
          in: query
          description: Filter articles covering a specific court case
          schema:
            type: string
        - name: limit
          in: query
          description: Max items to return (default 20, max 100)
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Keyset pagination cursor from previous response
          schema:
            type: string
      responses:
        '200':
          description: Keyset paginated article feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/articles/{slug}:
    get:
      summary: Get article by slug
      description: Retrieves a published article by slug. Applies paywall locking (truncating body) for premium articles if unauthenticated.
      operationId: getArticleBySlug
      tags:
        - Articles
      parameters:
        - name: slug
          in: path
          required: true
          description: URL-friendly article slug
          schema:
            type: string
      responses:
        '200':
          description: Article detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/judgments/{id}:
    get:
      summary: Get judgment summary by ID
      description: Retrieves an official judgment summary along with a short-lived presigned download URL for the attached official PDF.
      operationId: getJudgment
      tags:
        - Judgments
      parameters:
        - name: id
          in: path
          required: true
          description: Judgment summary article UUID
          schema:
            type: string
      responses:
        '200':
          description: Judgment summary with PDF download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgmentDetail'
        '404':
          description: Judgment summary not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/judgment:
    get:
      summary: Get judgment summary for court case
      description: Retrieves the judgment summary and attached official judgment PDF linked to a court case.
      operationId: getCaseJudgment
      tags:
        - Judgments
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      responses:
        '200':
          description: Judgment summary for court case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgmentDetail'
        '404':
          description: No judgment summary linked to case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles:
    post:
      summary: Create article draft (Staff only)
      description: Creates a new article draft. Reporters, editors, and admins can create drafts.
      operationId: createArticleDraft
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleDraftRequest'
      responses:
        '201':
          description: Article draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List CMS articles
      description: Lists articles for the editorial CMS with status, author, and search filters.
      operationId: listCMSArticles
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, in_review, published, archived]
        - name: type
          in: query
          schema:
            type: string
            enum: [news, commentary, editorial, judgment_summary]
        - name: category
          in: query
          schema:
            type: string
        - name: author_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: CMS articles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CMSArticleListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles/{id}:
    get:
      summary: Get CMS article detail
      description: Retrieves complete editorial article detail by ID.
      operationId: getCMSArticle
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Update article draft (Optimistic Locking)
      description: Updates an article draft. Requires expected_version for optimistic concurrency control.
      operationId: updateArticleDraft
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleDraftRequest'
      responses:
        '200':
          description: Article draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Optimistic lock conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles/{id}/submit:
    post:
      summary: Submit draft for review
      description: Author or editor transitions draft to in_review.
      operationId: submitArticleForReview
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article transitioned to in_review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles/{id}/send-back:
    post:
      summary: Send back article for revision (Editor/Admin only)
      description: Editor returns article in review back to draft with mandatory review comments.
      operationId: sendBackArticle
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendBackRequest'
      responses:
        '200':
          description: Article returned to draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Comment required or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles/{id}/publish:
    post:
      summary: Approve and publish article (Editor/Admin only)
      description: Editor approves and publishes article, making it visible on public feeds.
      operationId: publishArticle
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/articles/{id}/archive:
    post:
      summary: Archive article (Editor/Admin only)
      description: Transitions an article into archived status.
      operationId: archiveArticle
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'

  /v1/cms/articles/{id}/attachment:
    post:
      summary: Confirm PDF attachment metadata
      description: Attaches uploaded PDF object key, size, and checksum to an article.
      operationId: attachArticlePDF
      tags:
        - CMS Articles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachPDFRequest'
      responses:
        '200':
          description: Attachment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'

  /v1/cms/judgments:
    post:
      summary: Create judgment summary (Editor/Admin only)
      description: Creates a judgment summary article and links it to a court case in a single operation.
      operationId: createJudgmentSummary
      tags:
        - CMS Judgments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJudgmentRequest'
      responses:
        '201':
          description: Judgment summary created and linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'

  /v1/cms/uploads/presigned-url:
    post:
      summary: Request direct S3 presigned upload URL
      description: Validates file type and size constraints and returns a direct S3 presigned PUT URL.
      operationId: requestUploadURL
      tags:
        - CMS Uploads
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadURLRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLResponse'
        '400':
          description: Invalid file type or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/webhooks/payments:
    post:
      summary: Handle payment provider webhooks
      description: Receives asynchronous webhook events from payment gateway (Razorpay/Stripe) to activate, renew, or cancel subscriptions.
      operationId: handlePaymentWebhook
      tags:
        - Billing
      parameters:
        - name: X-Signature
          in: header
          description: HMAC-SHA256 webhook signature
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/subscription:
    get:
      summary: Get active subscription for authenticated user
      description: Returns subscription entitlement details for the currently logged-in user.
      operationId: getMySubscription
      tags:
        - Billing
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active subscription details or free status
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    allOf:
                      - $ref: '#/components/schemas/Subscription'
                    nullable: true
                  tier:
                    type: string
                    example: pro
                  is_entitled:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions:
    get:
      summary: List subscriptions (CMS)
      description: Returns paginated user subscriptions for editorial and billing management.
      operationId: listCMSSubscriptions
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Max items to return
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by subscription status
          schema:
            type: string
            enum: [trialing, active, past_due, cancelled, expired]
      responses:
        '200':
          description: Paginated subscriptions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions/grant:
    post:
      summary: Manually grant a subscription (Admin only)
      description: Provisions an active subscription tier directly to a user account.
      operationId: grantSubscription
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantSubscriptionRequest'
      responses:
        '201':
          description: Subscription granted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions/{id}/cancel:
    post:
      summary: Cancel a subscription (Admin only)
      description: Cancels an active subscription immediately.
      operationId: cancelSubscription
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription marked cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cancelled
                  id:
                    type: string
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/follow:
    get:
      summary: Get case follow status
      description: Returns whether the user is following the case and the total follower count.
      operationId: getCaseFollowStatus
      tags:
        - Case Follows
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Follow status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFollowStatusResponse'
    post:
      summary: Follow court case for push notifications
      description: Subscribes the user to real-time alerts for verdicts and orders on a case.
      operationId: followCase
      tags:
        - Case Follows
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowCaseRequest'
      responses:
        '200':
          description: Case followed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: following
                  case_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unfollow court case
      description: Removes user subscription from case alerts.
      operationId: unfollowCase
      tags:
        - Case Follows
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case unfollowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unfollowed
                  case_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/devices:
    post:
      summary: Register mobile/web push device token
      description: Registers or refreshes a device token for push notification delivery.
      operationId: registerDeviceToken
      tags:
        - Push Devices
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: registered
                  platform:
                    type: string
        '400':
          description: Invalid platform or push token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unregister device push token
      description: Removes a push token registration.
      operationId: unregisterDeviceToken
      tags:
        - Push Devices
      security:
        - BearerAuth: []
      parameters:
        - name: push_token
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
      responses:
        '200':
          description: Device token unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unregistered
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-16T03:08:00Z'
        services:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              example: connected

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: reader@livelaw.in
        password:
          type: string
          format: password
          example: ReaderPass123!
        full_name:
          type: string
          example: Jane Doe
        display_role:
          type: string
          enum: [public, student, lawyer, judge]
          default: public
        bar_council_number:
          type: string
          example: DL/1234/2020
        phone:
          type: string
          example: '+919876543210'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: reader@livelaw.in
        password:
          type: string
          format: password
          example: ReaderPass123!

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    CreateStaffRequest:
      type: object
      required:
        - email
        - password
        - full_name
        - system_role
      properties:
        email:
          type: string
          format: email
          example: reporter@livelaw.in
        password:
          type: string
          format: password
          example: ReporterPass123!
        full_name:
          type: string
          example: Court Reporter
        system_role:
          type: string
          enum: [reporter, editor, admin]
        display_role:
          type: string
          enum: [public, student, lawyer, judge]
          default: lawyer
        bar_council_number:
          type: string
        phone:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        system_role:
          type: string
          enum: [reader, reporter, editor, admin]
        status:
          type: string
          enum: [active, suspended, deleted]

    UserProfile:
      type: object
      required:
        - id
        - email
        - full_name
        - display_role
        - system_role
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: 019277f0-cf7e-7bf0-b485-055ec71a9cf0
        email:
          type: string
          format: email
          example: reader@livelaw.in
        full_name:
          type: string
          example: Jane Doe
        display_role:
          type: string
          enum: [public, student, lawyer, judge]
        system_role:
          type: string
          enum: [reader, reporter, editor, admin]
        bar_council_number:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, suspended, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required:
        - user
        - access_token
        - refresh_token
        - expires_at
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time

    UsersListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
        next_cursor:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - request_id
        - timestamp
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        request_id:
          type: string
          example: req_01JB3D6X7Y8Z9A0B1C2D3E4F5G
        timestamp:
          type: string
          format: date-time
          example: '2026-10-16T03:08:00Z'

    CourtCase:
      type: object
      required:
        - id
        - court_name
        - case_number
        - case_type
