                    type: string
        '400':
          description: Invalid platform or push token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unregister device push token
      description: Removes a push token registration.
      operationId: unregisterDeviceToken
      tags:
        - Push Devices
      security:
        - BearerAuth: []
      parameters:
        - name: push_token
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push_token:
                  type: string
      responses:
        '200':
          description: Device token unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
