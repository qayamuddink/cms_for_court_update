                  case_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unfollow court case
      description: Removes user subscription from case alerts.
      operationId: unfollowCase
      tags:
        - Case Follows
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case unfollowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unfollowed
                  case_id:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/devices:
    post:
      summary: Register mobile/web push device token
      description: Registers or refreshes a device token for push notification delivery.
      operationId: registerDeviceToken
