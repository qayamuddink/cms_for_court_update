      description: Scheduled or on-demand trigger to auto-create monthly digest drafts for prior month.
      operationId: generateMonthlyDigests
      tags:
        - CMS Digests
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Generated monthly digests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMonthlyResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-16T03:08:00Z'
        services:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              example: connected

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: reader@livelaw.in
        password:
          type: string
          format: password
          example: ReaderPass123!
        full_name:
          type: string
          example: Jane Doe
        display_role:
          type: string
          enum: [public, student, lawyer, judge]
          default: public
        bar_council_number:
          type: string
          example: DL/1234/2020
        phone:
          type: string
          example: '+919876543210'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: reader@livelaw.in
        password:
          type: string
          format: password
          example: ReaderPass123!

    RefreshRequest:
      type: object
      required:
