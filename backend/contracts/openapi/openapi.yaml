openapi: 3.0.3
info:
  title: LiveLaw Platform API
  description: High-performance Legal Journalism and Live Court Reporting Platform API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Health check
      description: Returns service liveness and database connectivity status.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is healthy and database is connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded or database connection is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/auth/register:
    post:
      summary: Register reader account
      description: Creates a new reader account and returns an authenticated token pair.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      summary: Authenticate user
      description: Validates email and password, returning short-lived access token and revocable refresh token.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      summary: Refresh tokens
      description: Rotates an active refresh token and returns a new access and refresh token pair.
      operationId: refreshToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed and rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      summary: Logout
      description: Revokes the specified refresh token.
      operationId: logout
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/me:
    get:
      summary: Get current user profile
      description: Retrieves the profile of the currently authenticated user.
      operationId: getMe
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/users:
    post:
      summary: Create staff account (Admin only)
      description: Administrator creates a reporter, editor, or admin account with strong password enforcement.
      operationId: createStaff
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List users (Admin only)
      description: Returns a paginated list of users using keyset pagination.
      operationId: listUsers
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of users to return (max 100)
          schema:
            type: integer
            default: 20
        - name: before_created_at
          in: query
          description: Keyset pagination timestamp cursor
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: Keyset pagination ID cursor
          schema:
            type: string
      responses:
        '200':
          description: Users list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/users/{id}:
    patch:
      summary: Update user role or status (Admin only)
      description: Administrator modifies system role or suspends/unsuspends a user account.
      operationId: updateUser
      tags:
        - CMS Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid role or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/live:
    get:
      summary: List live court cases
      description: Returns all court cases currently in active live reporting mode.
      operationId: listLiveCases
      tags:
        - Live Cases
      responses:
        '200':
          description: List of active live court cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCasesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}:
    get:
      summary: Get court case details
      description: Retrieves complete metadata and hearing status for a specific court case.
      operationId: getCase
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      responses:
        '200':
          description: Court case details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/updates:
    get:
      summary: Get case updates after sequence
      description: Replays or synchronizes live updates for a court case with sequence number strictly greater than after_sequence.
      operationId: getCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: after_sequence
          in: query
          description: Replay updates with sequence_no greater than this value
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Maximum number of updates to return (max 100)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Ordered list of updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdatesResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/updates/latest:
    get:
      summary: Get latest case updates
      description: Returns the most recent N updates for a court case in ascending chronological order.
      operationId: getLatestCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of updates to return (max 100)
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Ordered list of most recent updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdatesResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/stream:
    get:
      summary: Stream live courtroom ticker updates (SSE)
      description: Server-Sent Events stream for real-time court ticker updates. Each event contains the sequence number as event ID for gap detection.
      operationId: streamCaseUpdates
      tags:
        - Live Cases
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: after_sequence
          in: query
          description: Stream updates with sequence number strictly greater than this value
          schema:
            type: integer
            default: 0
        - name: Last-Event-ID
          in: header
          description: Standard SSE last received event ID (sequence number)
          schema:
            type: string
      responses:
        '200':
          description: Real-time event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases:
    post:
      summary: Create court case (Editor/Admin only)
      description: Registers a new court case for legal coverage and live reporting.
      operationId: createCase
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Court case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}:
    patch:
      summary: Update court case (Editor/Admin only)
      description: Modifies metadata, hearing date, or stage status of a court case.
      operationId: updateCase
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      responses:
        '200':
          description: Court case updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/live:
    post:
      summary: Toggle live coverage state (Editor/Admin only)
      description: Enables or disables the live ticker for a court case.
      operationId: setCaseLive
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLiveRequest'
      responses:
        '200':
          description: Live status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtCase'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/assign:
    post:
      summary: Assign reporter to case (Editor/Admin only)
      description: Authorizes a reporter to submit live updates from the courtroom.
      operationId: assignReporter
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReporterRequest'
      responses:
        '200':
          description: Reporter assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: assigned
        '400':
          description: Invalid user ID or user is not a reporter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/assign/{userId}:
    delete:
      summary: Unassign reporter from case (Editor/Admin only)
      description: Revokes reporter assignment to a court case.
      operationId: unassignReporter
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: Reporter user UUID
          schema:
            type: string
      responses:
        '200':
          description: Reporter unassigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unassigned
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/reporters:
    get:
      summary: List assigned reporters (Editor/Admin only)
      description: Returns all reporter user IDs authorized to post live updates to this case.
      operationId: listAssignedReporters
      tags:
        - CMS Cases
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
      responses:
        '200':
          description: List of assigned reporter user IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportersResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Editor or Admin role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates:
    post:
      summary: Publish live update (Assigned Reporter, Editor, Admin)
      description: Appends a new live update to the court case ticker. Guarantees append-only storage and strictly consecutive sequence numbers.
      operationId: publishLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent duplicate updates
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishUpdatePayload'
      responses:
        '201':
          description: Live update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Case closed or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (Reporter must be assigned to case)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (Verdict update already posted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates/{updateId}/correct:
    post:
      summary: Correct live update (Assigned Reporter, Editor, Admin)
      description: Appends a new correction update referencing an earlier update. Updates are never edited in place.
      operationId: correctLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: updateId
          in: path
          required: true
          description: Target live update UUID to correct
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectUpdatePayload'
      responses:
        '201':
          description: Correction update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Case closed, update retracted, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/cases/{id}/updates/{updateId}/retract:
    post:
      summary: Retract live update (Assigned Reporter, Editor, Admin)
      description: Appends a retraction update referencing the retracted update. Updates are never deleted or modified in place.
      operationId: retractLiveUpdate
      tags:
        - CMS Live Updates
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case UUID
          schema:
            type: string
        - name: updateId
          in: path
          required: true
          description: Target live update UUID to retract
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetractUpdatePayload'
      responses:
        '201':
          description: Retraction update appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveUpdate'
        '400':
          description: Update already retracted or case closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court case or update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-16T03:08:00Z'
        services:
          type: object
          required:
            - database
          properties:
            database:
              type: string
              example: connected

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: reader@livelaw.in
        password:
          type: string
          format: password
          example: ReaderPass123!
        full_name:
