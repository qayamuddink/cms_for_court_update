        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/search:
    get:
      summary: Full-text and filtered search
      description: Searches articles, judgments (including extracted PDF text with page numbers), and court cases with faceted filters and exact citation matching.
      operationId: searchAll
      tags:
        - Search
      parameters:
        - name: q
          in: query
          description: Free-text search terms or exact legal citation
          schema:
            type: string
        - name: type
          in: query
          description: Document type filter
          schema:
            type: string
            enum: [all, article, judgment, court_case]
            default: all
        - name: section
          in: query
          schema:
            type: string
        - name: court
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: judge
          in: query
          schema:
            type: string
        - name: statute
          in: query
          schema:
            type: string
        - name: section_cited
          in: query
          schema:
            type: string
        - name: article_type
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [relevance, date_desc, date_asc]
            default: relevance
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/search/autosuggest:
    get:
      summary: Typeahead autosuggest
      description: Fast prefix autosuggest for case names, statutes, and citations.
      operationId: searchAutosuggest
      tags:
        - Search
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Autosuggest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosuggestResult'

  /v1/cms/search/health:
    get:
