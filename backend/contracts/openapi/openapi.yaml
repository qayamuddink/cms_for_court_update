      operationId: publishDigest
      tags:
        - CMS Digests
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Digest published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishDigestResponse'
