      operationId: getSearchAnalytics
      tags:
        - CMS Search
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnalyticsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/digests:
    get:
      summary: List published legal digests and round-ups
      description: Returns published digests organized by court, year, and period.
      operationId: listPublicDigests
      tags:
        - Digests
      parameters:
        - name: court
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly, monthly, quarterly, annual, thematic]
        - name: type
          in: query
          schema:
            type: string
            enum: [digest, round_up]
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
