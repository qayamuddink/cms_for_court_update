      description: Updates judgment metadata, bench, headnotes, and structured statutory references.
      operationId: updateCMSJudgment
      tags:
        - CMS Judgments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJudgmentRequest'
      responses:
        '200':
          description: Judgment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialJudgmentResponse'

  /v1/cms/judgments/{id}/pdf:
    post:
      summary: Upload official judgment PDF
      description: Uploads and attaches official judgment PDF with magic bytes validation, duplicate checksum detection, virus scanning, and preview generation.
      operationId: uploadJudgmentPDF
      tags:
        - CMS Judgments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: query
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: PDF attached and queued for text extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialJudgmentResponse'
        '400':
          description: Invalid PDF or format error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate PDF checksum already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: File infected or rejected by virus scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/judgments/{id}/publish:
    post:
      summary: Publish judgment and allocate sequential citation
      description: Atomically increments the gapless sequential citation counter for the court and year, and marks the judgment published.
      operationId: publishCMSJudgment
      tags:
        - CMS Judgments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishJudgmentPayload'
      responses:
        '200':
          description: Judgment successfully published with official citation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishJudgmentResponse'
        '400':
          description: Publishing error (e.g. missing attached PDF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/uploads/presigned-url:
    post:
      summary: Request direct S3 presigned upload URL
      description: Validates file type and size constraints and returns a direct S3 presigned PUT URL.
      operationId: requestUploadURL
      tags:
        - CMS Uploads
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadURLRequest'
      responses:
        '200':
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLResponse'
        '400':
          description: Invalid file type or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/webhooks/payments:
    post:
      summary: Handle payment provider webhooks
      description: Receives asynchronous webhook events from payment gateway (Razorpay/Stripe) to activate, renew, or cancel subscriptions.
      operationId: handlePaymentWebhook
      tags:
        - Billing
      parameters:
        - name: X-Signature
          in: header
          description: HMAC-SHA256 webhook signature
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/subscription:
    get:
      summary: Get active subscription for authenticated user
      description: Returns subscription entitlement details for the currently logged-in user.
      operationId: getMySubscription
      tags:
        - Billing
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active subscription details or free status
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    allOf:
                      - $ref: '#/components/schemas/Subscription'
                    nullable: true
                  tier:
                    type: string
                    example: pro
                  is_entitled:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions:
    get:
      summary: List subscriptions (CMS)
      description: Returns paginated user subscriptions for editorial and billing management.
      operationId: listCMSSubscriptions
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Max items to return
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by subscription status
          schema:
            type: string
            enum: [trialing, active, past_due, cancelled, expired]
      responses:
        '200':
          description: Paginated subscriptions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions/grant:
    post:
      summary: Manually grant a subscription (Admin only)
      description: Provisions an active subscription tier directly to a user account.
      operationId: grantSubscription
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantSubscriptionRequest'
      responses:
        '201':
          description: Subscription granted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cms/subscriptions/{id}/cancel:
    post:
      summary: Cancel a subscription (Admin only)
      description: Cancels an active subscription immediately.
      operationId: cancelSubscription
      tags:
        - CMS Billing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription marked cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: cancelled
                  id:
                    type: string
        '403':
          description: Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/cases/{id}/follow:
    get:
      summary: Get case follow status
      description: Returns whether the user is following the case and the total follower count.
      operationId: getCaseFollowStatus
      tags:
        - Case Follows
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Follow status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseFollowStatusResponse'
    post:
      summary: Follow court case for push notifications
      description: Subscribes the user to real-time alerts for verdicts and orders on a case.
      operationId: followCase
      tags:
        - Case Follows
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Court case ID
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowCaseRequest'
      responses:
        '200':
          description: Case followed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
