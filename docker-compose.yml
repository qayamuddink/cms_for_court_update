services:
  postgres:
    image: postgres:16-alpine
    container_name: livelaw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livelaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livelaw_secret}
      POSTGRES_DB: ${POSTGRES_DB:-livelaw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livelaw} -d ${POSTGRES_DB:-livelaw}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: livelaw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio-create-bucket:
    image: cgr.dev/chainguard/minio:latest
    container_name: livelaw-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb -p myminio/$${S3_BUCKET:-livelaw-files};
        exit 0;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-livelaw-files}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livelaw-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      GRPC_PORT: 9090
      LIVE_ENGINE_MODE: ${LIVE_ENGINE_MODE:-inprocess}
      DATABASE_URL: postgres://${POSTGRES_USER:-livelaw}:${POSTGRES_PASSWORD:-livelaw_secret}@postgres:5432/${POSTGRES_DB:-livelaw}?sslmode=disable
      RUN_MIGRATIONS: "true"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-livelaw-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: livelaw-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: livelaw-cms
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  pgdata:
  miniodata:
  meilidata:

